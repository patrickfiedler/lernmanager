{% extends 'base.html' %}

{% block title %}Mein Konto - Lernmanager{% endblock %}

{% block content %}
<h1 class="mb-2">Passwort ändern</h1>

<div class="card">
    <form method="POST" action="{{ url_for('admin_passwort') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="current_password">Aktuelles Passwort</label>
            <input type="password" id="current_password" name="current_password" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="new_password">Neues Passwort</label>
            <input type="password" id="new_password" name="new_password" class="form-control" required minlength="6">
            <small class="text-muted">Mindestens 6 Zeichen</small>
        </div>

        <div class="form-group">
            <label for="confirm_password">Neues Passwort bestätigen</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary">Passwort ändern</button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Abbrechen</a>
    </form>
</div>

<h2 class="mt-3 mb-2">Schülernamen</h2>
<div class="card">
    <form method="POST" action="{{ url_for('admin_name_order') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <p class="text-muted">Gilt für alle Schülerlisten: Sortierung und Anzeige. Nur für dein Konto.</p>
        <label><input type="radio" name="name_order" value="nachname" {% if name_order == 'nachname' %}checked{% endif %}>
            Nachname, Vorname</label><br>
        <label><input type="radio" name="name_order" value="vorname" {% if name_order == 'vorname' %}checked{% endif %}>
            Vorname Nachname</label><br>
        <button type="submit" class="btn btn-primary mt-1">Speichern</button>
    </form>
</div>
{% endblock %}
